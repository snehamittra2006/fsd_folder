<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="header">
        <header>
            <img src="bus.jpg" style="border-radius: 50%; width: 100px; height: 100px;">
            <h1>Bus Booking System</h1>
        </header>
    </div>
    <div class="banner">
        <h2><center>User Information</center></h2>
    </div>
     <div class="form-group">
                <label for="name">User Name : </label>
                <input 
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >
            </div>

            <div class="form-group">
                <label for="age">User Age : </label>
                <input 
                    type="number"
                    id="age"
                    placeholder="Enter your age"
                >
            </div>

            <div class="form-group">
                <label for="aadhaar">Aadhaar Number : </label>
                <input 
                    type="text"
                    id="aadhaar"
                    placeholder="Enter Aadhaar Number"
                >
            </div>

            <div class="form-group">
                <label for="city">Select Your City</label>

                <select id="city">
                    <option value="">Select City</option>
                    <option value="delhi">Delhi</option>
                    <option value="mumbai">Mumbai</option>
                    <option value="bangalore">Bangalore</option>
                    <option value="lucknow">Lucknow</option>
                    <option value="jaipur">Jaipur</option>
                    <option value="agra">Agra</option>
                </select>
            </div>
            <div class="form-row">

                <label for="date">
                    Select Date
                </label>

                <input
                    type="date"
                    id="date"
                >
            </div>
            <div class="banner">
                <h2><center>Bus Information</center></h2>
            </div>
            <div class="bus-question">
                Select Your Bus type : 
            </div>
            <div class="bus-option">

                <span>
                    AC Bus&nbsp; 2000
                </span>

                <input
                    type="radio"
                    name="busType"
                    value="AC"
                >

            </div>
            <div class="bus-option">

                <span>
                    Non-AC Bus&nbsp; 1500
                </span>

                <input
                    type="radio"
                    name="busType"
                    value="Non-AC"
                >
            </div>
            <div class="bus-option">
                <label for="seat">Select Your Seat</label>

                <select id="seat">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                </select>
            </div>
            <button onclick="">Book Now</button>

</body>
</html>
